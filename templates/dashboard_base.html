{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Hirevance{% endblock %}</title>

    <link rel="shortcut icon"
          href="{% static 'images/favicon.png' %}"
          type="image/x-icon">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="{% static 'css/dashboard.css' %}">
</head>

<body>

    <section class="dashboard">

        <!-- SIDEBAR -->
        <aside class="side-bar">
            <div class="dash-logo">
                <img src="{%static 'images/hire-logo.png'%}" alt="">
            </div>
            <div class="side-bar-links">
            <a href="{% url 'dashboard' %}">
                 <span class="side-icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20"
             viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 9.5 12 3l9 6.5"/>
            <path d="M5 10v10h14V10"/>
            <path d="M9 20v-6h6v6"/>
        </svg>
    </span>
    <span>Dashboard</span>
            </a>
            <a href="{% url 'mock-test' %}">
                <span class="side-icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20"
             viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect width="18" height="18" x="3" y="3" rx="2"/>
            <path d="m9 12 2 2 4-4"/>
        </svg>
    </span>
    <span>Mock Tests</span>
            </a>
            <a href="{% url 'AI-assistant'%}">
                 <span class="side-icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20"
             viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect width="16" height="12" x="4" y="6" rx="2"/>
            <path d="M12 2v4"/>
            <path d="M8 12h.01"/>
            <path d="M16 12h.01"/>
            <path d="M9 16h6"/>
        </svg>
    </span>
    <span>Hirevance AI</span>
            </a>
            <a href="{% url 'resume-home' %}">
                <span class="side-icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20"
             viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/>
            <path d="M14 2v6h6"/>
            <path d="M8 13h8"/>
            <path d="M8 17h6"/>
        </svg>
    </span>
    <span>Resume</span>
            </a>
            <a href="{% url 'questions-list' %}">
                <span class="side-icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20"
             viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
            <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2Z"/>
        </svg>
    </span>
    <span>Questions</span>
            </a>
            <a href="{% url 'dashboard' %}#progress">
                <span class="side-icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20"
             viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 3v18h18"/>
            <path d="m7 16 4-5 3 3 5-7"/>
        </svg>
    </span>
    <span>Progress</span>
            </a>
            <a href="{% url 'bookmarks' %}">
                <span class="side-icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20"
             viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 3h12a2 2 0 0 1 2 2v16l-8-4-8 4V5a2 2 0 0 1 2-2Z"/>
        </svg>
    </span>
    <span>Bookmarks</span>
            </a>
            <a href="{% url 'settings' %}">
                <span class="side-icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20"
             viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-1.42 1.42-.06-.06a1.7 1.7 0 0 0-1.88-.34 1.7 1.7 0 0 0-1.03 1.55V21h-2v-.49a1.7 1.7 0 0 0-1.03-1.55 1.7 1.7 0 0 0-1.88.34l-.06.06-1.42-1.42.06-.06A1.7 1.7 0 0 0 9.4 15a1.7 1.7 0 0 0-1.55-1.03H7v-2h.85A1.7 1.7 0 0 0 9.4 11a1.7 1.7 0 0 0-.34-1.88L9 9.06l1.42-1.42.06.06a1.7 1.7 0 0 0 1.88.34A1.7 1.7 0 0 0 13.39 6.5V6h2v.5A1.7 1.7 0 0 0 16.42 8a1.7 1.7 0 0 0 1.88-.34l.06-.06 1.42 1.42-.06.06A1.7 1.7 0 0 0 19.4 11a1.7 1.7 0 0 0 1.55 1.03H21v2h-.05A1.7 1.7 0 0 0 19.4 15Z"/>
        </svg>
    </span>
    <span>Settings</span>
            </a>
            </div>
            <div class="quick-actions">
                <a href="{% url 'home' %}">Home</a>
                <a href="{% url 'logout' %}">Logout</a>
            </div>
        </aside>


       
        <div class="dashboard-content">

            {% block content %}
            {% endblock %}

        </div>

    </section>

</body>
</html>
