{% extends "base.html"%}
{% block content%}

<div class="register-container">
    <div class="register-card">
        <div class="register-head">
                <h1>Welcome Back</h1>
                <p>Continue your interview prparation journey</p>
        </div>
        <form action="" method="POST" autocomplete="off">
            {% csrf_token%}
            {{ form.non_field_errors }}
            <div class="form-group">
                        <label for="{{form.username.id_for_label}}">Username</label>
                        {{form.username}}
                        {{form.username.errors}}
            </div>
            <div class="form-group">
                        <label for="{{form.password.id_for_label}}">Password</label>
                        <div class="input-password">
                            {{form.password}}
                            <button type="button"  class="toggled-button" onclick="toggledPassword('{{form.password.id_for_label}}',this)">
                                <span class="eye-icon">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#617593" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-eye-icon lucide-eye"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg>
                                </span>
                                <span class="eye-off-icon">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#617593" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-eye-off-icon lucide-eye-off"><path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49"/><path d="M14.084 14.158a3 3 0 0 1-4.242-4.242"/><path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143"/><path d="m2 2 20 20"/></svg>
                                </span>
                            </button>
                        {{form.password.errors}}
                        </div>
            </div>
            <button type="submit">Login</button>
        </form>
        <p class="login-link">
        New User?
        <a href="{% url 'register' %}">Register</a>
    </p>
    </div>
</div>


{% endblock %}
